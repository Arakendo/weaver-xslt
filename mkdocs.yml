site_name: Weaver
site_description: TypeScript-native XSLT compiler with inspectable generated TypeScript, diagnostics-first design, and an interpreter reference backend.
site_url: https://weaverxslt.org/
repo_url: https://github.com/Arakendo/weaver-xslt
repo_name: Arakendo/weaver-xslt

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  icon:
    logo: material/transit-connection-variant

nav:
  - Home: index.md
  - Workbench: WORKBENCH.md
  - Documentation:
      - Governance: project-governance.md
      - Document Status: document-status.md
  - Specifications:
      - Overview: Specifications/README.md
      - Software Design: Specifications/Weaver Software Design Document.md
      - Product Thesis: Specifications/Weaver Product Thesis.md
      - Error Design: Specifications/Weaver Error Design Document.md
      - XPath Design: Specifications/Weaver XPath Design Document.md
      - Semantic Boundaries: Specifications/Weaver Semantic Boundary Specification.md
      - Security Boundaries: Specifications/Weaver Security Boundary Specification.md
      - URI Resolution: Specifications/Weaver URI Resolution Specification.md
      - Entity Resolution: Specifications/Weaver Entity Resolution Specification.md
      - Diagnostic Intrinsics: Specifications/Weaver Diagnostic Intrinsics Specification.md
      - Native Execution Boundary: Specifications/Weaver Native Execution Boundary Specification.md
      - Native Plan Boundary: Specifications/Weaver Native Plan Boundary Specification.md
      - Workbench API: Specifications/Weaver Workbench API Specification.md
      - Template Priority: Specifications/Weaver Template Priority Specification.md
      - WeaverPDF Architecture: Specifications/WeaverPDF Architecture Specification.md
      - WeaverPDF Syntax Profile: Specifications/WeaverPDF Syntax Profile.md
      - WeaverPDF v1: Specifications/WeaverPDF v1 Specification.md
  - Architecture Governance:
      - Decisions:
          - Overview: ADR/README.md
          - Engine Representation And Semantic Ownership: ADR/ADR-0001-engine-representation-and-semantic-ownership.md
          - Diagnostics And Public Boundaries: ADR/ADR-0002-diagnostics-and-public-boundaries.md
          - Dual Execution And Conformance Parity: ADR/ADR-0003-dual-execution-and-conformance-parity.md
          - Source Unit Cohesion, Size Pressure, And Decomposition: ADR/ADR-0004-source-unit-cohesion-size-pressure-and-decomposition.md
      - Reviews:
          - Overview: Architectural Reviews/README.md
          - Streaming And Incremental Execution: Architectural Reviews/AR-0001-streaming-and-incremental-execution-boundary.md
          - Schema Validation Boundary: Architectural Reviews/AR-0002-schema-validation-boundary.md
          - WeaverPDF Document And Layout Boundary: Architectural Reviews/AR-0003-weaverpdf-document-and-layout-boundary.md
  - Plans:
      - Overview: Plans/README.md
      - Roadmap: Plans/Weaver Roadmap.md
      - Codegen Source Decomposition: Plans/Codegen Source Decomposition.md
      - Static Analysis Source Decomposition: Plans/Static Analysis Source Decomposition.md
      - Interpreter Source Decomposition: Plans/Interpreter Source Decomposition.md
      - Runtime Source Decomposition: Plans/Runtime Source Decomposition.md
      - CLI Source Decomposition: Plans/CLI Source Decomposition.md
      - Regex Source Decomposition: Plans/Regex Source Decomposition.md
      - Compile Performance: Plans/Compile Performance.md
      - Fallback File Size: Plans/Fallback File Size.md
      - JS Renderer Artifacts: Plans/JS Renderer Artifacts.md
      - NuGet Integration: Plans/NuGet Integration.md
      - Practical Streaming: Plans/Practical Streaming.md
      - XSD Validation: Plans/XSD Validation.md
      - Workbench Embed: Plans/Workbench Embed.md
      - XML Node Debugging: Plans/XML Node Debugging.md
      - WeaverPDF: Plans/WeaverPDF.md
      - Documentation Lifecycle: Plans/documentation-lifecycle-and-governance.md
  - Evidence:
      - Overview: Evidence/README.md
      - Progress Artifacts: Evidence/Progress Artifacts.md
      - Native Execution Record: Evidence/Native Execution Implementation Record.md
      - Workbench Record: Evidence/Workbench Implementation Record.md
      - Workbench Evidence: Evidence/Workbench Evidence Checklist.md
      - Chrome DevTools Verification: Evidence/Chrome DevTools Verification.md
      - XML Coverage Diagnostics: XML_COVERAGE_DIAGNOSTICS.md
  - Corpus:
      - Overview: Corpus/README.md
      - Comparison Harness: Corpus/Comparison Harness.md
      - QT3 Gate: Corpus/QT3 Gate.md
      - Test Sources: Corpus/Test Sources.md
      - .NET XML Suite: DOTNET_XML_SUITE.md
  - Notes:
      - Overview: Notes/README.md
      - Project Brief: Notes/Weaver Project Brief.md
      - Lessons Learned: Notes/Lessons Learned.md
      - Documentation Audit: Notes/documentation-governance-audit.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - assets/workbench/app.css

extra_javascript:
  - assets/workbench/app.js

extra:
  generator: false
